version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: aurexia
      POSTGRES_USER: aurexia
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aurexia-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - aurexia-network

  consensus-node:
    build:
      context: .
      dockerfile: Dockerfile
      target: consensus
    ports:
      - "30303:30303" # P2P
      - "8545:8545"   # RPC
      - "8546:8546"   # WebSocket
    volumes:
      - ./genesis.json:/app/genesis.json
      - ./config.toml:/app/config.toml
      - consensus_data:/app/data
    networks:
      - aurexia-network
    depends_on:
      - postgres
      - redis

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CONSENSUS_HOST=consensus-node
    networks:
      - aurexia-network
    depends_on:
      - consensus-node

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "3000:3000"
    networks:
      - aurexia-network
    depends_on:
      - api-gateway

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/build:/usr/share/nginx/html
    networks:
      - aurexia-network
    depends_on:
      - frontend
      - api-gateway

networks:
  aurexia-network:
    driver: bridge

volumes:
  postgres_data:
  consensus_data:

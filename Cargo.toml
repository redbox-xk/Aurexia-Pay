[package]
name = "aurexia-consensus"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha3 = "0.10"
hex = "0.4"
ed25519-dalek = "2.0"
rand = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
reqwest = "0.11"
rocksdb = "0.21"
futures = "0.3"
libp2p = "0.53"
chrono = "0.4"
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

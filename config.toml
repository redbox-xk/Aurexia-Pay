[network]
port = 30303
rpc_port = 8545
ws_port = 8546
max_peers = 50
bootstrap_nodes = [
    "/ip4/127.0.0.1/tcp/30303/p2p/QmBootstrapNode1",
]

[consensus]
type = "dpos" # Delegated Proof of Stake
epoch_duration = 86400 # 24 hours in seconds
max_validators = 21
min_stake = "1000000"
unbonding_period = 604800 # 7 days

[blockchain]
chain_id = 1337
block_time = 5 # seconds
max_gas_limit = 15000000
max_block_size = 1048576 # 1MB

[storage]
data_dir = "./data"
database = "rocksdb"
state_pruning = "archive"

[rpc]
enabled = true
api_modules = ["eth", "net", "web3", "personal", "txpool", "aurexia"]
cors_domains = ["*"]
vhosts = ["*"]

[metrics]
enabled = true
prometheus_port = 9090

[log]
level = "info"
file = "./logs/aurexia.log"
format = "json"

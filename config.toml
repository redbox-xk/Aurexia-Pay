# Aurexia Mainnet Node Configuration

[chain]
id = 666
name = "Aurexia Mainnet"
network = "mainnet"

[consensus]
block_time = "0.5s"
block_gas_limit = 30000000
max_tx_per_block = 10000
max_bytes_per_block = 10485760
epoch_length = 43200
min_validator_stake = 1000000000000000000000000
max_validators = 1000
unbonding_period = "504h"
slashing_window = "720h"
base_reward = 100000000000000000000
slash_fraction = 500

[p2p]
listen_addr = "tcp://0.0.0.0:30303"
max_peers = 50

[rpc]
listen_addr = "tcp://0.0.0.0:8545"
http_enabled = true
ws_enabled = true
max_connections = 1000

[txpool]
max_pool_size = 10000
max_tx_size = 131072

[metrics]
enabled = true
prometheus_listen_addr = "0.0.0.0:26660"

[log]
level = "info"
format = "json"
output_file = "/var/log/aurexia/chain.log"
